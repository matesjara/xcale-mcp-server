name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the production image (Dockerfile: node:22-alpine). Node 20 is EOL.
          node-version: 22
          cache: npm
      # Only the audit steps below need this, and they need it badly. npm is retiring the legacy
      # `POST /-/npm/v1/security/audits/quick` endpoint that the npm shipped with Node 22 calls,
      # and it now answers 400 with "Invalid package tree, run npm install to rebuild your
      # package-lock.json". That message is misleading: `npm ci` succeeds on the same tree, and
      # npm 11 locally reports 0 vulnerabilities against it. npm 11 uses the bulk advisory
      # endpoint instead, which is the one that is not going away.
      #
      # The RUNTIME stays Node 22 deliberately — matching the production image is the whole point
      # of pinning it above. This upgrades only the client that talks to the advisory API.
      - name: Use an npm whose audit client is not the retired endpoint
        run: npm install -g npm@11
      - run: npm ci
      - name: Guard — providers must not hand-write inputSchema (single source of truth)
        run: |
          if grep -rn "inputSchema" src/providers; then
            echo "::error::Providers must declare tools via defineTool (zod). Hand-written inputSchema is forbidden (ADR: canonical-provider-pattern)."
            exit 1
          fi
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Two steps, same threshold, both blocking — the split tells you at a glance whether a
      # finding reaches production. The full-tree step is deliberate: the test toolchain runs on
      # CI runners and dev machines with credentials in scope. See
      # docs/adr/0014-supply-chain-audit-gate.md (do NOT narrow this to --omit=dev).
      - name: Audit — production deps (high+ severity)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit — full tree incl. toolchain (high+ severity)
        run: npm audit --audit-level=high
